# LDTF в Docker.
#   1. Рядом с этим файлом создайте .env с паролем веб-интерфейса:  LDTF_PASSWORD=придумайте-пароль
#   2. docker compose up -d   →   http://<адрес сервера>:8765
# С доменом и https (сертификат Caddy получит сам; DNS домена должен указывать на сервер) — добавьте в .env
#   LDTF_DOMAIN=ldtf.example.com
#   LDTF_PUBLISH=127.0.0.1:8765        # тогда LDTF без https снаружи не виден
# и запускайте: docker compose --profile https up -d   →   https://ldtf.example.com
# Обновление до новой версии:  docker compose pull && docker compose up -d   (архивы в ./data остаются)
# Консоль LDTF:  docker compose exec ldtf python -m dtf_backup status --user <ник>
services:
  ldtf:
    image: ghcr.io/gwynerva/ldtf:latest
    # build: .                       # или собрать образ из исходников этой папки
    container_name: ldtf
    restart: unless-stopped
    init: true
    stop_grace_period: 30s           # синхронизации успевают сохранить прогресс
    environment:
      TZ: Europe/Moscow              # по этому времени идёт расписание «каждый день в 09:00»
      LDTF_PASSWORD: ${LDTF_PASSWORD:?задайте LDTF_PASSWORD в файле .env рядом с compose.yaml}
      LDTF_UID: ${LDTF_UID:-1000}    # владелец папки ./data (LDTF сам отдаст её этому пользователю)
      LDTF_GID: ${LDTF_GID:-1000}
      # LDTF_AUTH: "off"             # без пароля — только если вход уже проверяет обратный прокси
      # LDTF_MCP_TOKEN: ...          # свой токен для ИИ-агентов (иначе LDTF выпустит его сам)
    volumes:
      - ./data:/data
    ports:
      - "${LDTF_PUBLISH:-8765}:8765"   # вся сеть; только этот сервер (за прокси): LDTF_PUBLISH=127.0.0.1:8765

  # https перед LDTF (docker compose --profile https up -d): Caddy сам получает и продлевает сертификат
  caddy:
    profiles: ["https"]
    image: caddy:2
    container_name: ldtf-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from ${LDTF_DOMAIN:-localhost} --to ldtf:8765
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - ldtf

volumes:
  caddy-data:
