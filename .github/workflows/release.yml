name: Release

# A tag vX.Y.Z (equal to dtf_backup.__version__) builds and publishes everything:
#   the Windows zip with LDTF.exe + SHA256SUMS (the in-app updater checks it), the image ghcr.io/gwynerva/ldtf
#   (amd64 + arm64; "latest" only for releases, not for vX.Y.Z-rc1), and the GitHub release with the notes of that
#   version from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: The tag is the app's version
        shell: bash
        run: test "v$(python -c 'import dtf_backup; print(dtf_backup.__version__)')" = "$GITHUB_REF_NAME"
      - name: Tests
        run: python -X utf8 -m unittest discover -s tests
      - name: Build LDTF-<version>-windows-x64.zip (embedded Python, LDTF.exe)
        run: python -X utf8 tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/LDTF-*-windows-x64.zip
            dist/SHA256SUMS

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gwynerva/ldtf
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [windows, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Notes of this version from CHANGELOG.md
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "LDTF ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre
