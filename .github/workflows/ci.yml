name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no network)
        run: python -X utf8 -m unittest discover -s tests -v

  docker:
    name: docker image (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ldtf:ci .
      - name: Refuses the network without a password, starts with one, needs a login
        run: |
          ! docker run --rm ldtf:ci
          docker run -d --name ldtf -e LDTF_PASSWORD=ci -p 8765:8765 ldtf:ci
          for i in $(seq 30); do curl -fs http://127.0.0.1:8765/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 303
          docker stop ldtf
          docker logs ldtf
