name: CI

on:
  push:
    branches: [main, "v*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no network)
        run: python -X utf8 -m unittest discover -s tests -v
      - name: LDTF.exe builds (the launcher and the window, against the WebView2 SDK)
        if: runner.os == 'Windows'
        run: python -X utf8 tools/build_release.py --exe-only build/exe --out build

  docker:
    name: docker image (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ldtf:ci .
      - name: Refuses the network without a password, starts with one, needs a login
        run: |
          ! docker run --rm ldtf:ci
          # a host folder that belongs to root (what Docker makes for ./data): the entrypoint gives it to 1000:1000
          mkdir data && sudo chown root:root data
          docker run -d --name ldtf -e LDTF_PASSWORD=ci -p 8765:8765 -v "$PWD/data:/data" ldtf:ci
          for i in $(seq 30); do curl -fs http://127.0.0.1:8765/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 303
          test "$(stat -c %u data)" = 1000
          test "$(docker exec ldtf id -u)" = 0 && test "$(docker top ldtf -o user,args | grep dtf_backup | awk '{print $1}')" != root
          docker stop ldtf
          docker logs ldtf

  linux-release:
    name: linux release (install.sh, systemd-less check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -X utf8 tools/build_release.py --linux
      - name: The tarball holds the app and the server files
        run: |
          tar -tzf dist/LDTF-*-linux.tar.gz | grep -qx 'ldtf/dtf_backup/__init__.py'
          tar -tzvf dist/LDTF-*-linux.tar.gz | grep -q -- '-rwxr-xr-x .* ldtf/install.sh'
          sh -n tools/server/install.sh && sh -n tools/server/ldtf-run.sh
